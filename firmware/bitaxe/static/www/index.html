<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AxeOS unavailable</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <!-- Rust-owned compatibility fallback, not copied from upstream ESP-Miner. -->
    <main class="shell" aria-labelledby="page-title">
      <section class="status">
        <p class="eyebrow">Bitaxe Rust Firmware</p>
        <h1 id="page-title">AxeOS unavailable</h1>
        <p>Open /recovery and upload www.bin to restore the web interface.</p>
        <section class="provenance" aria-labelledby="provenance-title">
          <h2 id="provenance-title">Firmware provenance</h2>
          <dl>
            <div><dt>Version</dt><dd id="provenance-version">Unavailable</dd></div>
            <div>
              <dt>Source commit</dt>
              <dd>
                <a
                  id="provenance-commit"
                  target="_blank"
                  rel="noopener noreferrer"
                >Unavailable</a>
              </dd>
            </div>
            <div><dt>Built</dt><dd id="provenance-built">Unavailable</dd></div>
          </dl>
          <a
            class="source-link"
            href="https://github.com/bright-builds-llc/bitaxe-esp-miner"
            target="_blank"
            rel="noopener noreferrer"
          >View source</a>
        </section>
        <div class="actions" aria-label="Recovery actions">
          <a href="/recovery">Open recovery</a>
          <a href="/assets/release.json">Release metadata</a>
        </div>
      </section>
    </main>
    <script src="/assets/provenance.js"></script>
  </body>
</html>
