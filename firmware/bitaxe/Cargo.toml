[package]
name = "bitaxe-firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Test-only: lowers the local overheat trip (ADR-0040). Built only through the
# `--//firmware/bitaxe:firmware_variant=overheat-trip-test` package, never released.
overheat-trip-test = ["bitaxe-runtime/overheat-trip-test"]
# Builds for the Gamma 601 (ADR-0041): the safe boot, with the ASIC held in reset and the
# TPS546 output off. Built only through `//firmware/bitaxe:firmware_image_gamma601`.
board-gamma-601 = []
# Test-only (ADR-0041): the 601 safe boot plus one bounded core-voltage check with the ASIC held
# in reset. Built only through the `--//firmware/bitaxe:firmware_variant=gamma601-vout-check`
# 601 package, never released.
gamma601-vout-check = ["board-gamma-601"]
# Test-only (ADR-0041): the 601 firmware that may power the BM1370 and admit mining dispatch,
# for the phase F3 hardware contracts. Built only through the
# `--//firmware/bitaxe:firmware_variant=gamma601-mining` 601 package, never released.
gamma601-mining = ["board-gamma-601"]

[dependencies]
anyhow.workspace = true
bitaxe-api = { path = "../../crates/bitaxe-api" }
bitaxe-asic = { path = "../../crates/bitaxe-asic" }
bitaxe-config = { path = "../../crates/bitaxe-config" }
bitaxe-core = { path = "../../crates/bitaxe-core", features = ["native-fault-provenance"] }
bitaxe-runtime = { path = "../../crates/bitaxe-runtime" }
bitaxe-safety = { path = "../../crates/bitaxe-safety" }
bitaxe-stratum = { path = "../../crates/bitaxe-stratum" }
bitaxe-worker-control = { path = "../../crates/bitaxe-worker-control" }
embedded-graphics.workspace = true
embedded-hal.workspace = true
esp-idf-svc.workspace = true
esp-idf-sys.workspace = true
log.workspace = true
rand = { workspace = true, features = ["std_rng"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssd1306.workspace = true
zeroize.workspace = true

[build-dependencies]
bitaxe-api = { path = "../../crates/bitaxe-api" }
embuild.workspace = true

[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.4"
esp_idf_tools_install_dir = "workspace"
esp_idf_sdkconfig = "sdkconfig"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/bitaxe_fault_provenance"]
