name: Evidence redaction

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: extractions/setup-just@v3
      - name: Verify active semantic evidence
        run: just verify-redaction
