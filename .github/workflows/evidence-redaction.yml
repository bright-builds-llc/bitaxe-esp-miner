name: Evidence redaction

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: extractions/setup-just@v3
      - name: Verify changed and admitted evidence
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
          NEW_BRANCH_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" == 0000000000000000000000000000000000000000 ]]; then
            just verify-redaction \
              --base "$BASE_REF" \
              --head "$HEAD_REF" \
              --new-branch-base "$NEW_BRANCH_BASE_REF"
          else
            just verify-redaction --base "$BASE_REF" --head "$HEAD_REF"
          fi
